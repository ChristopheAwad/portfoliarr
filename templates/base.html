<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TEMPLATE INHERITANCE — the concept:
         base.html holds everything EVERY page shares (head, assets, navbar,
         search). Child templates (index.html, stock.html) declare that
         they extend this file and fill only the named block "holes" (they
         look like brace-percent tags in the markup below):
           title    — the browser-tab text
           content  — everything inside <main>
           scripts  — the page's own JS file (loaded AFTER common.js)
         One navbar to maintain, zero copy-paste drift between pages.
         (Jinja parses its tags even inside HTML comments, so this note
         can't show the tags literally.) -->
    <title>{% block title %}Portfoliarr{% endblock %}</title>

    <!-- The favicon is static/favicon.png, rasterized from
         assets/logo/portfoliarr-icon.svg (the 64x64 downscale; the rounded
         tile's corners stay transparent so it sits clean on dark and light
         tab bars alike). PNG (not the earlier hand-written SVG) because
         Firefox and Safari silently ignore SVG favicons — a PNG tab icon
         works in every browser. The 1254x1254 PNG in assets/logo/ is the
         master copy, and portfoliarr-icon.svg is its source. -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <!-- Dark mode FOUC prevention: read the saved theme (or OS preference)
         and set class="dark" on <html> BEFORE first paint. Without this,
         the page flashes light then snaps dark. The script is tiny (no
         external deps) and precedes the stylesheet, so CSS loading cannot
         delay the theme decision. -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var prefersDark = mql.matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            // If the user hasn't explicitly chosen, follow OS changes live.
            mql.addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    document.documentElement.classList.toggle('dark', e.matches);
                }
            });
        })();
    </script>

    <!-- The local stylesheet declares Fraunces and Instrument Sans with
         font-display: swap. Text uses the existing fallbacks while those
         font files load. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Only Dashboard and Stock fill this block with the local chart
         libraries. Their deferred scripts run in document order before
         perf.js, common.js and the page script below. -->
    {% block head_extra %}{% endblock %}

    <!-- Download the scripts as the document parses. defer preserves this
         order and runs them after the page, including the tab bar, exists. -->
    <script defer src="{{ url_for('static', filename='js/perf.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</head>
<!-- The body tag itself is a block hole: pages can stamp attributes onto
     it. stock.html uses it for data-symbol (stock.js's identity hook). -->
<body{% block body_attrs %}{% endblock %}>

    <!-- Top Navigation Bar — shared by every page (that's why it lives in
         the base template): the dashboard and the stock detail page both
         extend this file, so the navbar exists in exactly ONE place. -->
    <header class="navbar">
        <div class="nav-left">
            <!-- The Portfoliarr wordmark. A small inline SVG coin stack
                 with beveled edges, engraved inner rims, a dollar cutout
                 on the top coin, and a growth arrow + the brand name,
                 with the tail accented so it
                 reads as a mark rather than plain text. The SVG uses
                 stroke="currentColor" and fill="currentColor" and takes
                 its color from CSS (.logo-mark) — the markup stays
                 theme-agnostic and the stylesheet stays the single source
                 of color truth. The logo doubles as "home": it used to be
                 a plain <span> on the one-page app; now that a second page
                 exists at /stock/<symbol>, the link is how you get back. -->
            <a href="/" class="logo">
                <svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24"
                     aria-hidden="true">
                    <defs>
                        <mask id="logoDollarNav" maskUnits="userSpaceOnUse"
                              x="0" y="0" width="24" height="24">
                            <rect width="24" height="24" fill="white"></rect>
                            <path d="M12 10.2 V13.8 M13.2 10.9 C13.2 10.35 12.65 10.1 12 10.1 C11.35 10.1 10.85 10.45 10.85 11 C10.85 12.25 13.15 11.75 13.15 13 C13.15 13.55 12.65 13.9 12 13.9 C11.35 13.9 10.8 13.65 10.8 13.1"
                                  fill="none" stroke="black" stroke-width="1.2"
                                  stroke-linecap="round" stroke-linejoin="round"></path>
                        </mask>
                    </defs>
                    <path d="M12 9 V2.4 M8.7 5.4 L12 2.1 L15.3 5.4"
                          fill="none" stroke="currentColor" stroke-width="2.6"
                          stroke-linecap="round" stroke-linejoin="round"></path>
                    <g mask="url(#logoDollarNav)">
                        <path d="M4.2 12 v1.5 a7.8 3 0 0 0 15.6 0 v-1.5 Z"
                              fill="currentColor" opacity=".78"></path>
                        <ellipse cx="12" cy="12" rx="7.8" ry="3" fill="currentColor"></ellipse>
                    </g>
                    <ellipse cx="12" cy="12" rx="6.1" ry="1.9" fill="none"
                             stroke="currentColor" stroke-opacity=".55" stroke-width=".66"></ellipse>
                    <path d="M12 10.2 V13.8 M13.2 10.9 C13.2 10.35 12.65 10.1 12 10.1 C11.35 10.1 10.85 10.45 10.85 11 C10.85 12.25 13.15 11.75 13.15 13 C13.15 13.55 12.65 13.9 12 13.9 C11.35 13.9 10.8 13.65 10.8 13.1"
                          fill="none" stroke="currentColor" stroke-width=".55"
                          stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M4.2 19.4 v1.5 a7.8 3 0 0 0 15.6 0 v-1.5 Z"
                          fill="currentColor" opacity=".78"></path>
                    <ellipse cx="12" cy="19.4" rx="7.8" ry="3" fill="currentColor"></ellipse>
                    <ellipse cx="12" cy="19.4" rx="6.1" ry="1.9" fill="none"
                             stroke="currentColor" stroke-opacity=".55" stroke-width=".66"></ellipse>
                </svg>
                <span>Portfoli<span class="logo-accent">arr</span></span>
            </a>
            <!-- Dashboard & Ledger have moved to the bottom tab bar
                 (see the bottom_tabs block before </body>). -->
        </div>
        <!-- Right side of navbar: profile/preferences button. common.js
             wires the dropdown toggle; clicking "Preferences" navigates
             to the dedicated preferences page. g.user is guaranteed by
             the auth gate for every page that renders this template. -->
        <div class="nav-right">
            <button id="profile-btn" class="profile-btn" type="button"
                    title="Preferences" aria-label="Preferences"
                    aria-expanded="false" aria-controls="profile-dropdown">
                <svg viewBox="0 0 24 24" width="20" height="20"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <div id="profile-dropdown" class="profile-dropdown" hidden>
                <div class="profile-dropdown-user">
                    <span class="sub-text">Signed in as</span>
                    <strong id="nav-username">{{ g.user.username }}</strong>
                </div>
                <a href="{{ url_for('preferences_page') }}" class="profile-dropdown-link">
                    Preferences
                </a>
                <!-- Log out is a FORM (POST), not a link: no URL-fetch,
                     prefetcher, or accelerator can log anyone out by
                     "helpfully" following a GET /auth/logout. Works with
                     JavaScript disabled; common.js only toggles this
                     dropdown's visibility. -->
                <form method="post" action="{{ url_for('auth_logout') }}">
                    <button type="submit"
                            class="profile-dropdown-link profile-logout">
                        Log out
                    </button>
                </form>
            </div>
        </div>
        <div class="search-container">
            <!-- The search box. common.js turns
                 typing into /api/search calls and renders the suggestion
                 dropdown below it. autocomplete="off" silences the
                 browser's own suggestion list, which would fight ours for
                 the same keystrokes.
                 The decorative magnifier is pure CSS-positioned eye candy:
                 pointer-events: none lets clicks fall through to the input,
                 and it sits inside a .search-input-wrap wrapper rather
                 than directly in .search-container because the wrapper (not
                 the container) is its positioning context — the container
                 itself goes position: static inside the ≤920px media query,
                 which would otherwise leave the icon anchoring to the
                 sticky navbar. The input's id/placeholder/autocomplete are
                 JS hooks and stay untouched. -->
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ticker-search" placeholder="Search for stocks & ETFs..."
                       autocomplete="off">
            </div>
            <!-- Suggestion dropdown. Ships hidden; common.js fills it from
                 /api/search and unhides it while the input has text. -->
            <div id="search-results" class="search-results" hidden></div>
        </div>
    </header>

    <!-- Main Container — each page fills this block with its own layout. -->
    <main class="container">
        <div id="portfolio-load-status" class="portfolio-load-status" role="alert" hidden>
            <span id="portfolio-load-message"></span>
            <button id="portfolio-load-retry" class="btn-action" type="button">Retry</button>
        </div>
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom tab bar — only pages that fill this block show it.
         Dashboard, Ledger, and stock detail opt in; preferences doesn't. -->
    {% block bottom_tabs %}{% endblock %}
</body>
</html>
