<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TEMPLATE INHERITANCE — the concept:
         base.html holds everything EVERY page shares (head, CDN, navbar,
         search). Child templates (index.html, stock.html) declare that
         they extend this file and fill only the named block "holes" (they
         look like brace-percent tags in the markup below):
           title    — the browser-tab text
           content  — everything inside <main>
           scripts  — the page's own JS file (loaded AFTER common.js)
         One navbar to maintain, zero copy-paste drift between pages.
         (Jinja parses its tags even inside HTML comments, so this note
         can't show the tags literally.) -->
    <title>{% block title %}Portfoliarr{% endblock %}</title>

    <!-- The favicon is static/favicon.png, rasterized from
         assets/logo/portfoliarr-icon.svg (the 64x64 downscale; the rounded
         tile's corners stay transparent so it sits clean on dark and light
         tab bars alike). PNG (not the earlier hand-written SVG) because
         Firefox and Safari silently ignore SVG favicons — a PNG tab icon
         works in every browser. The 1254x1254 PNG in assets/logo/ is the
         master copy, and portfoliarr-icon.svg is its source. -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- TWO typefaces with distinct jobs, from Google Fonts' CDN (free
         hosted copies — same pattern as Chart.js below: nothing to
         install, they ship straight to the browser). The two preconnect
         lines tell the browser "you WILL talk to these hosts — open the
         connection now", so the font stylesheet and the font files
         themselves start downloading the instant the css2 link is parsed
         instead of waiting for a fresh DNS + TLS handshake.
         fonts.gstatic.com (the actual font files) needs crossorigin
         because font requests are CORS-mode requests. display=swap means
         text renders immediately in the fallback stack and upgrades when
         the fonts arrive — no invisible-text period.

         Fraunces (variable axis: optical size 9..144, weight 400..700) is
         the DISPLAY voice — wordmark + headings; its high optical sizes
         look like currency engraving, the "printed money" identity.
         Instrument Sans (400..700) is the UI face — body copy, controls,
         and every figure (pairs with tabular-nums for live prices).
         The old Inter stays in the CSS fallback chain, so a failed
         download changes nothing but the face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap">

    <!-- Chart.js, loaded from a public CDN (a free hosted copy — nothing to
         pip install, it ships straight to the browser). Loading it here adds
         a global "Chart" class to the page. <head> placement guarantees the
         library exists before main.js / stock.js (bottom of <body>) try to
         use it. Both pages have a chart, so it lives in the shared head. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <!-- Annotation plugin for Chart.js — draws the prev-close reference
         line on 1D charts. Loaded after Chart.js so the global "Chart"
         class exists; the plugin auto-registers when it loads. -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>

    <!-- Dark mode FOUC prevention: read the saved theme (or OS preference)
         and set class="dark" on <html> BEFORE first paint. Without this,
         the page flashes light then snaps dark. The script is tiny (no
         external deps) and runs synchronously in <head> so the browser
         never renders the wrong theme. -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var prefersDark = mql.matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            // If the user hasn't explicitly chosen, follow OS changes live.
            mql.addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    document.documentElement.classList.toggle('dark', e.matches);
                }
            });
        })();
    </script>
</head>
<!-- The body tag itself is a block hole: pages can stamp attributes onto
     it. stock.html uses it for data-symbol (stock.js's identity hook). -->
<body{% block body_attrs %}{% endblock %}>

    <!-- Top Navigation Bar — shared by every page (that's why it lives in
         the base template): the dashboard and the stock detail page both
         extend this file, so the navbar exists in exactly ONE place. -->
    <header class="navbar">
        <div class="nav-left">
            <!-- The Portfoliarr wordmark. A small inline SVG coin stack
                 with a growth arrow + the brand name,
                 with the tail accented so it reads as a mark rather than
                 plain text. The SVG uses stroke="currentColor" and
                 fill="currentColor" and takes its color from CSS
                 (.logo-mark) — the markup stays theme-agnostic and the
                 stylesheet stays the single source of color truth. The
                 logo doubles as "home": it used to be a plain <span> on
                 the one-page app; now that a second page exists at
                 /stock/<symbol>, the link is how you get back. -->
            <a href="/" class="logo">
                <svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24"
                     aria-hidden="true">
                    <path d="M12 5.6 V1.6 M9.7 3.8 L12 1.5 L14.3 3.8"
                          fill="none" stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"></path>
                    <ellipse cx="12" cy="10.4" rx="8.6" ry="3.1" fill="currentColor"></ellipse>
                    <ellipse cx="12" cy="17.2" rx="8.6" ry="3.1" fill="currentColor"></ellipse>
                </svg>
                <span>Portfoli<span class="logo-accent">arr</span></span>
            </a>
            <!-- Dashboard & Ledger have moved to the bottom tab bar
                 (see the bottom_tabs block before </body>). -->
        </div>
        <!-- Right side of navbar: profile/preferences button. common.js
             wires the dropdown toggle; clicking "Preferences" navigates
             to the dedicated preferences page. -->
        <div class="nav-right">
            <button id="profile-btn" class="profile-btn" type="button"
                    title="Preferences" aria-label="Preferences"
                    aria-expanded="false" aria-controls="profile-dropdown">
                <svg viewBox="0 0 24 24" width="20" height="20"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <div id="profile-dropdown" class="profile-dropdown" hidden>
                <a href="{{ url_for('preferences_page') }}" class="profile-dropdown-link">
                    Preferences
                </a>
            </div>
        </div>
        <div class="search-container">
            <!-- The search box. common.js (loaded at the bottom) turns
                 typing into /api/search calls and renders the suggestion
                 dropdown below it. autocomplete="off" silences the
                 browser's own suggestion list, which would fight ours for
                 the same keystrokes.
                 The decorative magnifier is pure CSS-positioned eye candy:
                 pointer-events: none lets clicks fall through to the input,
                 and it sits inside a .search-input-wrap wrapper rather
                 than directly in .search-container because the wrapper (not
                 the container) is its positioning context — the container
                 itself goes position: static inside the ≤920px media query,
                 which would otherwise leave the icon anchoring to the
                 sticky navbar. The input's id/placeholder/autocomplete are
                 JS hooks and stay untouched. -->
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ticker-search" placeholder="Search for stocks & ETFs..."
                       autocomplete="off">
            </div>
            <!-- Suggestion dropdown. Ships hidden; common.js fills it from
                 /api/search and unhides it while the input has text. -->
            <div id="search-results" class="search-results" hidden></div>
        </div>
    </header>

    <!-- Main Container — each page fills this block with its own layout. -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Shared JS loads FIRST: common.js defines the formatting helpers,
         the shared chart factory, and the search-dropdown logic as plain
         globals. The page script (the block below) depends on them, so
         ORDER MATTERS — the same reason Chart.js sits in <head> above. -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}

    <!-- Bottom tab bar — only pages that fill this block show it.
         Dashboard, Ledger, and stock detail opt in; preferences doesn't. -->
    {% block bottom_tabs %}{% endblock %}
</body>
</html>
