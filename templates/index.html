<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Finance Clone</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js, loaded from a public CDN (a free hosted copy — nothing to
         pip install, it ships straight to the browser). Loading it here adds
         a global "Chart" class to the page. <head> placement guarantees the
         library exists before main.js (bottom of <body>) tries to use it. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <span class="logo"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span> <span class="gray">Finance</span></span>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search for stocks & ETFs...">
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Market Index Chips. data-symbol is the hook main.js uses to find
             each chip (by meaning, not position). Every chip here is managed:
             main.js blanks them to "…" on load and fills with live data. -->
        <section class="indices-bar">
            <div class="chip" data-symbol="^GSPC">
                <span class="index-name">S&P 500</span>
                <span class="index-price">5,088.80</span>
                <span class="index-change pos">+0.42%</span>
            </div>
            <div class="chip" data-symbol="^IXIC">
                <span class="index-name">Nasdaq</span>
                <span class="index-price">16,000.10</span>
                <span class="index-change pos">+0.83%</span>
            </div>
            <div class="chip" data-symbol="^GSPTSE">
                <span class="index-name">TSX</span>
                <span class="index-price">38,989.84</span>
                <span class="index-change neg">-0.15%</span>
            </div>
            <div class="chip" data-symbol="BTC-USD">
                <span class="index-name">Bitcoin</span>
                <span class="index-price">2,016.69</span>
                <span class="index-change pos">+0.10%</span>
            </div>
        </section>

        <!-- Main Dashboard Content Grid -->
        <div class="dashboard-grid">

            <!-- Left Main Column -->
            <div class="main-content">
                <div class="card stock-header-card">
                    <div class="stock-title">
                        <h2>Your Portfolio</h2>
                        <span class="badge">Main</span>
                    </div>
                    <div class="stock-price-container">
                        <span class="current-price">$143.96</span>
                        <span class="price-change pos">+1.85 (+1.30%) Today</span>
                    </div>

                    <!-- Chart area. Chart.js paints onto a <canvas> — think
                         of it as a blank drawing pad. main.js finds it by id
                         and draws the chart on it (placeholder data for now;
                         real backend data comes later). -->
                    <div class="chart-box">
                        <canvas id="portfolioChart"></canvas>
                    </div>

                    <div class="chart-timeframe-selectors">
                        <button class="time-btn active">1D</button>
                        <button class="time-btn">5D</button>
                        <button class="time-btn">1M</button>
                        <button class="time-btn">6M</button>
                        <button class="time-btn">YTD</button>
                        <button class="time-btn">1Y</button>
                        <button class="time-btn">5Y</button>
                        <button class="time-btn">MAX</button>
                    </div>
                </div>

                <!-- Transaction Ledger card. Two parts:
                     1. A form to log a BUY/SELL (the only way rows are born)
                     2. A table whose <tbody> ships EMPTY — main.js rebuilds
                        the rows from /api/transactions every cycle, exactly
                        like the watchlist's <ul>. Facts + live gain/value
                        are painted by JS; a failed quote gap-fills to "—". -->
                <div class="card ledger-card">
                    <div class="card-header">
                        <h3>Transactions</h3>
                    </div>

                    <!-- The inline log form. name= attributes are what JS
                         reads via FormData; required gives free browser-side
                         validation, while the REAL validation lives in the
                         backend (400s with named fields) — the browser is
                         only a first filter. -->
                    <form id="tx-form" class="tx-form">
                        <input type="text" name="ticker" placeholder="Ticker"
                               autocomplete="off" required>
                        <input type="date" name="date" required>
                        <input type="number" name="price" placeholder="Price"
                               step="any" min="0" required>
                        <input type="number" name="qty" placeholder="Qty"
                               step="any" min="0" required>
                        <select name="type">
                            <option value="BUY">Buy</option>
                            <option value="SELL">Sell</option>
                        </select>
                        <button type="submit">Log</button>
                    </form>

                    <!-- Backend error messages (bad date, unknown ticker...)
                         land here — inline, watchlist-alert style but quiet. -->
                    <p class="tx-error" hidden></p>

                    <table class="ledger-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Ticker</th>
                                <th class="num">Qty</th>
                                <th class="num">Price</th>
                                <th class="num">Value</th>
                                <th class="num">Total Gain</th>
                                <th class="num">Total Gain %</th>
                                <th class="num">Day Gain</th>
                                <th class="num">Day Gain %</th>
                            </tr>
                        </thead>
                        <tbody id="ledger-body">
                            <!-- main.js fills this: one <tr class="ledger-row">
                                 per transaction, or a single empty-state row. -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Sidebar Column (Watchlist) -->
            <aside class="sidebar">
                
                <!-- Watchlist Card. Unlike the indices chips above, watchlist
                     rows come and go, so the HTML ships an EMPTY list and
                     main.js builds the rows from /api/watchlist. The list is
                     rebuilt on every refresh cycle, so nothing static here. -->
                <div class="card watchlist-card">
                    <div class="card-header">
                        <h3>Watchlist</h3>
                        <button class="btn-text" id="add-ticker-btn">+ Add</button>
                    </div>
                    <ul class="watchlist">
                        <!-- main.js fills this: one <li class="watchlist-item">
                             per symbol, or a single empty-state row when the
                             watchlist has nothing in it. -->
                    </ul>
                </div>

            </aside>
        </div>

    </main>

    <!-- main.js is loaded last so the HTML above exists before it runs.
         url_for stamps the correct static path at render time. -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
