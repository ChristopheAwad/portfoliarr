{% extends "base.html" %}

<!-- The dashboard page. Everything shared (head, CDN, navbar, search)
     lives in base.html; only the dashboard's own layout is here. The
     script include moved into the `scripts` block, which base.html renders
     AFTER common.js — the shared helpers must exist before this page's
     code runs. -->

{% block title %}Portfoliarr{% endblock %}

{% block content %}

        <!-- Market Index Chips. data-symbol is the hook main.js uses to find
             each chip (by meaning, not position). Every chip here is managed:
             the price/change spans ship EMPTY and main.js fills them with
             live data — while a span is empty, a CSS :empty shimmer box
             stands in for the number (and a failed quote still degrades to
             "—"). No mockup numbers in the markup: static lookalikes would
             masquerade as live data. Each chip is ALSO a real <a> to its
             detail page — a plain anchor (not a JS click handler) gives
             native middle-click / open-in-new-tab / keyboard Enter for
             free, same rule as the ledger's ticker links. url_for
             percent-encodes ^ (illegal raw in a URL) → /stock/%5EGSPC;
             Flask decodes it back on the way in. Keep data-symbol and
             url_for's symbol in sync — same ticker, two hooks: one for
             JS, one for the browser. -->
        <section class="indices-bar">
            <a class="chip" data-symbol="^GSPC" href="{{ url_for('stock_page', symbol='^GSPC') }}">
                <div class="chip-top">
                    <span class="index-name">S&amp;P 500</span>
                    <span class="index-price"></span>
                </div>
                <span class="index-change pos"></span>
            </a>
            <a class="chip" data-symbol="^IXIC" href="{{ url_for('stock_page', symbol='^IXIC') }}">
                <div class="chip-top">
                    <span class="index-name">Nasdaq</span>
                    <span class="index-price"></span>
                </div>
                <span class="index-change pos"></span>
            </a>
            <a class="chip" data-symbol="^GSPTSE" href="{{ url_for('stock_page', symbol='^GSPTSE') }}">
                <div class="chip-top">
                    <span class="index-name">TSX</span>
                    <span class="index-price"></span>
                </div>
                <span class="index-change neg"></span>
            </a>
            <a class="chip" data-symbol="BTC-USD" href="{{ url_for('stock_page', symbol='BTC-USD') }}">
                <div class="chip-top">
                    <span class="index-name">Bitcoin</span>
                    <span class="index-price"></span>
                </div>
                <span class="index-change pos"></span>
            </a>
        </section>

        <!-- Main Dashboard Content Grid -->
        <div class="dashboard-grid">

            <!-- Left Main Column -->
            <div class="main-content">
                <div class="card stock-header-card">
                    <div class="stock-title">
                        <h2>Your Portfolio</h2>
                        <span class="badge">Main</span>
                        <!-- Privacy button: click to hide/show portfolio value
                             for screen sharing. Eye icon swaps to eye-off when
                             active. State persists in localStorage. -->
                        <button type="button" class="privacy-btn"
                                id="hide-portfolio-toggle"
                                title="Hide portfolio values"
                                aria-label="Hide portfolio values"
                                aria-pressed="false"
                                data-hidden="false">
                            <svg class="icon privacy-eye" viewBox="0 0 24 24" width="16" height="16"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon privacy-eye-off" viewBox="0 0 24 24" width="16" height="16"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            </svg>
                        </button>
                        <!-- The ledger's display-currency toggle. OFF
                             (default): the whole ledger reads in CAD.
                             ON: USD securities flip back to their native
                             USD (CAD rows are unaffected either way).
                             ONLY the ledger flips — the portfolio total
                             and the chart below are ALWAYS CAD (main.js
                             sends ?currency= to /api/transactions and
                             nothing else). Session-only: every page load
                             starts in CAD again, by design. -->
                        <label class="fx-toggle" title="Show USD holdings in their native USD instead of CAD">
                            <span class="fx-switch">
                                <input type="checkbox" id="usd-native-toggle">
                                <span class="fx-knob"></span>
                            </span>
                            Show USD in USD
                        </label>
                    </div>
                    <!-- Live portfolio numbers. These spans ship COMPLETELY
                         EMPTY — not even whitespace (the :empty CSS selector
                         is false the moment any text node exists, and a
                         shimmer keyframe in style.css draws a loading
                         skeleton only while they're empty). main.js fills
                         them from GET /api/portfolio/summary the moment the
                         page loads (backend sends raw floats; formatting is
                         frontend-only). The ids are the hooks JS finds them
                         by; static mockup numbers are gone so they can
                         never masquerade as live data. -->
                    <div class="stock-price-container">
                        <span class="current-price" id="portfolio-value"></span>
                        <span class="price-change" id="portfolio-day-change"></span>
                        <span class="price-change" id="portfolio-total-return"></span>
                    </div>

                    <!-- Chart area. Chart.js paints onto a <canvas> — think
                         of it as a blank drawing pad. main.js finds it by
                         id and draws the real portfolio value history on
                         it (computed by GET /api/portfolio/history from
                         the ledger + close prices). -->
                    <div class="chart-box">
                        <canvas id="portfolioChart"></canvas>
                    </div>

                    <!-- Timeframe selector. The first button keeps `active`
                         (the default chart view on load is 5D — main.js
                         matches its default period to this). main.js reads
                         each button's textContent as the period key and
                         swaps `active` on click. -->
                    <div class="chart-timeframe-selectors">
                        <button class="time-btn">1D</button>
                        <button class="time-btn active">5D</button>
                        <button class="time-btn">1M</button>
                        <button class="time-btn">3M</button>
                        <button class="time-btn">6M</button>
                        <button class="time-btn">YTD</button>
                        <button class="time-btn">1Y</button>
                        <button class="time-btn">5Y</button>
                        <button class="time-btn">MAX</button>
                    </div>
                </div>

            </div>

            <!-- Right Sidebar Column (Watchlist) -->
            <aside class="sidebar">

                <!-- Watchlist Card. Unlike the indices chips above, watchlist
                     rows come and go, so the HTML ships an EMPTY list and
                     main.js builds the rows from /api/watchlist. The list is
                     rebuilt on every refresh cycle, so nothing static here. -->
                <div class="card watchlist-card">
                    <div class="card-header">
                        <h3>Watchlist</h3>
                        <button class="btn-text" id="add-ticker-btn">+ Add</button>
                    </div>
                    <ul class="watchlist">
                        <!-- main.js fills this: one <li class="watchlist-item">
                             per symbol, or a single empty-state row when the
                             watchlist has nothing in it. -->
                    </ul>
                </div>

            </aside>
        </div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
