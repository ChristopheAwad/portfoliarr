{% extends "base.html" %}

{% block title %}Preferences — Portfoliarr{% endblock %}

{% block content %}

        <div class="preferences-page">
            <h2>Preferences</h2>

            <!-- Theme setting. Light/Dark/System — the same three options
                 the old inline dropdown offered, now on a dedicated page.
                 preferences.js reads localStorage on load and saves on change. -->
            <div class="card preferences-card">
                <h3>Appearance</h3>
                <div class="pref-row">
                    <label class="pref-label" for="pref-theme">Theme</label>
                    <select id="pref-theme" class="pref-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="system">System</option>
                    </select>
                </div>
            </div>

            <!-- Default ledger sort. Column + direction — the same controls
                 that used to live in the gear menu, now on a dedicated page.
                 Dashboard header-click sorting still works independently. -->
            <div class="card preferences-card">
                <h3>Ledger</h3>
                <div class="pref-row">
                    <label class="pref-label" for="pref-sort-col">Default sort</label>
                    <div class="pref-sort-row">
                        <button class="btn-icon btn-dir" id="pref-sort-dir-btn"
                                type="button" aria-label="Sort direction" disabled>
                            <span id="pref-sort-dir-icon">▼</span>
                        </button>
                        <select id="pref-sort-col" class="pref-select">
                            <option value="">None (backend order)</option>
                            <option value="ticker">Ticker</option>
                            <option value="qty">Qty</option>
                            <option value="value">Value</option>
                            <option value="total_gain">Total Gain</option>
                            <option value="total_gain_pct">Total Gain %</option>
                            <option value="day_gain">Day Gain</option>
                            <option value="day_gain_pct">Day Gain %</option>
                        </select>
                    </div>
                </div>

                <!-- Show closed positions. OFF (default): tickers you hold
                     zero shares of (bought out entirely) are hidden from
                     the ledger's group list, so traded-out positions stop
                     crowding the "what do I hold" view. ON: they're back.
                     NOTHING is deleted either way — the stored transactions
                     are the cost basis the Closed sales math replays, so
                     this is presentation-only, persisted as
                     "showClosedPositions" ("true"/"false") and read by
                     ledger.js on every render (applies within one 60s
                     poll, no reload needed). -->
                <div class="pref-row">
                    <label class="pref-label" for="pref-show-closed">Show closed positions</label>
                    <label class="fx-toggle" title="Keep fully-sold positions visible in the ledger">
                        <span class="fx-switch">
                            <input type="checkbox" id="pref-show-closed">
                            <span class="fx-knob"></span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="card preferences-card">
                <h3>About</h3>
                <div class="pref-row">
                    <span class="pref-label">Version</span>
                    <span class="app-version">{{ app_version }}</span>
                </div>
            </div>
        </div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/preferences.js') }}"></script>
{% endblock %}
