<!DOCTYPE html>
<!-- templates/_auth_head.html — the WHOLE document skeleton of the auth
     pages: login.html, setup.html, and signup.html each extend this and
     fill two blocks (the tab title and the card's content). Sharing one
     skeleton means the three pages cannot drift apart on viewport, favicon,
     stylesheet, the brand typefaces, or the dark-mode head script.

     DEFINITELY no common.js here: the auth pages run with NO JavaScript
     of their own. common.js on a login page would fetch /api/portfolios,
     watch the 401 land, and redirect back to /auth/login forever. The
     script IN THE HEAD is not the same thing — it only prevents the
     light-then-dark theme flash. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block auth_title %}Portfoliarr{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap">

    <!-- The same dark-mode theme bootstrap base.html runs in its head:
         without it the auth pages would flash light-mode behind a saved
         dark preference — the login suddenly feels like its own foreign
         app. Kept in step with base.html's version. -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var prefersDark = mql.matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            mql.addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    document.documentElement.classList.toggle('dark', e.matches);
                }
            });
        })();
    </script>
</head>
<body>
    <main class="auth-page">
        <!-- The wordmark, shared with base.html's navbar (same inline SVG
             beveled coin stack with the dollar cutout; class .auth-logo
             re-sizes it for the quiet page). -->
        <a href="/" class="logo auth-logo">
            <svg class="logo-mark" viewBox="0 0 24 24" width="28" height="28"
                 aria-hidden="true">
                <defs>
                    <mask id="logoDollarAuth" maskUnits="userSpaceOnUse"
                          x="0" y="0" width="24" height="24">
                        <rect width="24" height="24" fill="white"></rect>
                        <path d="M12 10.2 V13.8 M13.2 10.9 C13.2 10.35 12.65 10.1 12 10.1 C11.35 10.1 10.85 10.45 10.85 11 C10.85 12.25 13.15 11.75 13.15 13 C13.15 13.55 12.65 13.9 12 13.9 C11.35 13.9 10.8 13.65 10.8 13.1"
                              fill="none" stroke="black" stroke-width="1.2"
                              stroke-linecap="round" stroke-linejoin="round"></path>
                    </mask>
                </defs>
                <path d="M12 9 V2.4 M8.7 5.4 L12 2.1 L15.3 5.4"
                      fill="none" stroke="currentColor" stroke-width="2.6"
                      stroke-linecap="round" stroke-linejoin="round"></path>
                <g mask="url(#logoDollarAuth)">
                    <path d="M4.2 12 v1.5 a7.8 3 0 0 0 15.6 0 v-1.5 Z"
                          fill="currentColor" opacity=".78"></path>
                    <ellipse cx="12" cy="12" rx="7.8" ry="3" fill="currentColor"></ellipse>
                </g>
                <ellipse cx="12" cy="12" rx="6.1" ry="1.9" fill="none"
                         stroke="currentColor" stroke-opacity=".55" stroke-width=".66"></ellipse>
                <path d="M12 10.2 V13.8 M13.2 10.9 C13.2 10.35 12.65 10.1 12 10.1 C11.35 10.1 10.85 10.45 10.85 11 C10.85 12.25 13.15 11.75 13.15 13 C13.15 13.55 12.65 13.9 12 13.9 C11.35 13.9 10.8 13.65 10.8 13.1"
                      fill="none" stroke="currentColor" stroke-width=".55"
                      stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M4.2 19.4 v1.5 a7.8 3 0 0 0 15.6 0 v-1.5 Z"
                      fill="currentColor" opacity=".78"></path>
                <ellipse cx="12" cy="19.4" rx="7.8" ry="3" fill="currentColor"></ellipse>
                <ellipse cx="12" cy="19.4" rx="6.1" ry="1.9" fill="none"
                         stroke="currentColor" stroke-opacity=".55" stroke-width=".66"></ellipse>
            </svg>
            <span>Portfoli<span class="logo-accent">arr</span></span>
        </a>
        <div class="card auth-card">
            {% block auth_card %}{% endblock %}
        </div>
    </main>
</body>
</html>
