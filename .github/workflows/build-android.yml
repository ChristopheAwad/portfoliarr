# ──────────────────────────────────────────────────────────────
# MOVE THIS FILE when android/ gets its own repo.
#
# To move:
#   1. Copy android/ and the root VERSION file to the new repo. Change
#      build.gradle.kts to resolve VERSION from rootProject.projectDir.
#   2. Copy this file to <new-repo>/.github/workflows/build.yml
#   3. Remove the `paths:` filter (no longer needed — the whole
#      repo is the Android app).
#   4. Change the `working-directory` below from `android` to `.`
#      (or remove it entirely).
#   5. Update the artifact path from
#      `android/app/build/outputs/apk/debug/app-debug.apk`
#      to `app/build/outputs/apk/debug/app-debug.apk`.
#   6. Delete this file from the portfoliarr repo.
# ──────────────────────────────────────────────────────────────

name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "VERSION"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # GitHub's ubuntu runners ship a preinstalled Android SDK
      # ($ANDROID_HOME), so no sdkmanager setup is needed. The old
      # android-actions/setup-android@v3 step failed on every run with
      # "sdkmanager exit 1" (flaky license/tooling handshake), so here we
      # accept licenses DETERMINISTICALLY by writing the SDK's known
      # license hashes — AGP reads these files before auto-downloading
      # missing components (platform 34, build-tools) during the build.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55"  > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: android

      # Unique per-run artifact name: every download self-identifies. Every
      # run before #37 (Sep 15 2026) uploaded the SAME name while signed with
      # a per-runner throwaway key — a stale download then refuses to install
      # over a newer build ("App not installed" = signature mismatch).
      - uses: actions/upload-artifact@v4
        with:
          name: portfoliarr-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
