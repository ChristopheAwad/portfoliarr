# ──────────────────────────────────────────────────────────────
# MOVE THIS FILE when android/ gets its own repo.
#
# To move:
#   1. Copy this file to <new-repo>/.github/workflows/build.yml
#   2. Remove the `paths:` filter (no longer needed — the whole
#      repo is the Android app).
#   3. Change the `working-directory` below from `android` to `.`
#      (or remove it entirely).
#   4. Update the artifact path from
#      `android/app/build/outputs/apk/debug/app-debug.apk`
#      to `app/build/outputs/apk/debug/app-debug.apk`.
#   5. Delete this file from the portfoliarr repo.
# ──────────────────────────────────────────────────────────────

name: Build Android APK

on:
  push:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: portfoliarr-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
