# GitHub Actions: test main, then build & publish the Docker image to GHCR.
#
# The contract: ghcr.io/christopheawad/portfoliarr:latest always reflects
# the latest state of main — but ONLY states of main that passed the full
# pytest suite. The server decides when to adopt an update
# (`docker compose pull && docker compose up -d`); CI never touches it.
#
# Auth: no registry secrets are configured anywhere. The built-in
# GITHUB_TOKEN, granted `packages: write` below, is enough to push to
# ghcr.io for this repo's own package.

name: docker

on:
  push:
    branches: [main]
  workflow_dispatch: # manual runs, for rebuilding on demand

permissions:
  contents: read
  packages: write # push the image to GHCR

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full test suite
        run: python -m pytest

  build-and-push:
    name: Build, smoke test & push image
    needs: test # a red main never produces an image — this job is skipped
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Load one local image so the artifact we smoke-test is the exact set
      # of layers later tagged and pushed. A second remote build could drift
      # or accidentally publish despite a runtime-only startup failure.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: portfoliarr-smoke:${{ github.sha }}
          # GitHub Actions layer cache: as long as requirements.txt is
          # unchanged, rebuilds reuse the cached pip-install layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          image="portfoliarr-smoke:${{ github.sha }}"
          container="portfoliarr-smoke"
          volume="portfoliarr-smoke-data"

          docker volume create "$volume"
          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1::5000 \
            --volume "$volume:/app/instance" \
            --env TZ=America/Toronto \
            "$image"

          mapped=$(docker port "$container" 5000/tcp)
          port=${mapped##*:}
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${port}/preferences" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          pid_one_uid=$(docker exec "$container" sh -c \
            'while read -r key real rest; do
               [ "$key" = "Uid:" ] && { echo "$real"; break; }
             done < /proc/1/status')
          test "$pid_one_uid" = "1000"
          docker exec "$container" touch /app/instance/.smoke-persisted

          docker restart "$container"
          mapped=$(docker port "$container" 5000/tcp)
          port=${mapped##*:}
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${port}/preferences" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container" test -f /app/instance/.smoke-persisted

          docker stop --time 10 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        shell: bash
        run: |
          set -euo pipefail
          source_image="portfoliarr-smoke:${{ github.sha }}"
          latest="ghcr.io/christopheawad/portfoliarr:latest"
          immutable="ghcr.io/christopheawad/portfoliarr:${{ github.sha }}"
          docker tag "$source_image" "$latest"
          docker tag "$source_image" "$immutable"
          docker push "$latest"
          docker push "$immutable"

      - name: Clean up smoke resources
        if: always()
        run: |
          docker rm --force portfoliarr-smoke 2>/dev/null || true
          docker volume rm --force portfoliarr-smoke-data 2>/dev/null || true
