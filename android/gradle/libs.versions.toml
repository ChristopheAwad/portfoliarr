[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
webkit = "1.12.1"
lifecycleRuntime = "2.8.6"
biometric = "1.1.0"
# WorkManager drives the #51 widget's 30-minute refresh. 2.9.1 is the last
# release that builds against compileSdk 34; newer ones need 35+.
work = "2.9.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
# BiometricPrompt, which has had no home in the framework since API 28.
# 1.1.0 is the last stable; it is what carries DEVICE_CREDENTIAL fallback
# back to the minSdk 24 devices this app still supports.
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# The widget's 30-minute refresh (#51). Plain work-runtime, not the -ktx
# artifact: the worker is a synchronous HttpURLConnection job.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
