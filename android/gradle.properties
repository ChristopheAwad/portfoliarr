org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Android versioning — bump BOTH before each APK release:
# versionCode must be strictly increasing (Android refuses updates otherwise)
# and versionName is the only way to tell builds apart in the phone's Settings,
# since every build shares the same signing certificate by design.
VERSION_CODE=2
VERSION_NAME=1.1
