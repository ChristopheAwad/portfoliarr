org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Android releases: bump VERSION_CODE here and the root VERSION file.
# VERSION_CODE must strictly increase or Android refuses the update. The shared
# root VERSION is the human-readable release shown by Android and Flask.
#
# 6 is not a release number, it is the escape hatch from the scrapped PR #75
# trial. That build, and the replacement baseline APK on branch
# release/android-baseline-1.4, are both VERSION_CODE 5. Android refuses a
# DOWNGRADE, so shipping this branch's APK at the old 2 would fail to install
# with "App not installed" over either of them. Any future build here must
# exceed whatever is on the user's phone — check that branch before choosing
# a number, and keep tests/test_android_biometric.py's floor in step.
VERSION_CODE=6
